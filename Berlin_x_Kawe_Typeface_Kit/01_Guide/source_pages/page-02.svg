<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>Berlin x Kawe Type Guide 2</title>
<rect width="1600" height="1000" fill="#000000"/>
<text x="72" y="62" font-family="Nimbus Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#ffffff" letter-spacing="0.5" opacity="1.0" style="">BERLIN × KAWE</text><text x="800" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#a8a8a2" letter-spacing="1.6" opacity="1.0" style="">DESIGN PRINCIPLE</text><text x="1528" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="end" fill="#a8a8a2" letter-spacing="0" opacity="1.0" style="">02</text><text x="72" y="205" font-family="Nimbus Sans" font-size="190" font-weight="bold" text-anchor="start" fill="#ffffff" letter-spacing="-8" opacity="1.0" style="">TYPE</text><text x="72" y="385" font-family="Nimbus Sans" font-size="190" font-weight="bold" text-anchor="start" fill="#ffffff" letter-spacing="-8" opacity="1.0" style="">AS PLACE</text><text x="72" y="545" font-family="Nimbus Sans" font-size="29" font-weight="bold" text-anchor="start" fill="#ffffff" letter-spacing="0" opacity="1.0" style="">The system behaves like Berlin itself</text><text x="72" y="595" font-family="Nimbus Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#d8d8d3" letter-spacing="0" opacity="1.0" style="">Institutional precision meets the pressure of the street.</text><text x="72" y="632" font-family="Nimbus Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#d8d8d3" letter-spacing="0" opacity="1.0" style="">Weight creates presence. Alignment creates authority.</text><text x="72" y="669" font-family="Nimbus Sans" font-size="24" font-weight="normal" text-anchor="start" fill="#d8d8d3" letter-spacing="0" opacity="1.0" style="">Silence creates room for other people to enter.</text><rect x="1060" y="170" width="390" height="390" rx="0" fill="#ffffff" stroke="none" stroke-width="0" opacity="1"/><text x="1255" y="432" font-family="Nimbus Sans" font-size="300" font-weight="bold" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">×</text><text x="1060" y="625" font-family="Nimbus Mono PS" font-size="15" font-weight="normal" text-anchor="start" fill="#bdbdb7" letter-spacing="1.8" opacity="1.0" style="">CORE PRINCIPLE</text><text x="1060" y="670" font-family="Nimbus Sans" font-size="23" font-weight="bold" text-anchor="start" fill="#ffffff" letter-spacing="0" opacity="1.0" style="">The crossing is a relationship,</text><text x="1060" y="704" font-family="Nimbus Sans" font-size="23" font-weight="bold" text-anchor="start" fill="#ffffff" letter-spacing="0" opacity="1.0" style="">not a decorative symbol.</text>
</svg>