<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<title>Editorial Page</title>
<rect width="1240" height="1754" fill="#ffffff"/>
<text x="86" y="90" font-family="Nimbus Mono PS" font-size="15" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.3" opacity="1.0" style="">BERLIN × KAWE / FIELD NOTES</text><text x="1154" y="90" font-family="Nimbus Mono PS" font-size="15" font-weight="normal" text-anchor="end" fill="#000000" letter-spacing="0" opacity="1.0" style="">03</text><text x="86" y="265" font-family="Nimbus Sans" font-size="72" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-3" opacity="1.0" style="">The city is not</text><text x="86" y="340" font-family="Nimbus Sans" font-size="72" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-3" opacity="1.0" style="">a neutral surface.</text><text x="86" y="445" font-family="Nimbus Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Every frame contains a negotiation between the person who</text><text x="86" y="484" font-family="Nimbus Sans" font-size="25" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">looks, the city that answers and the people who pass through.</text><text x="86" y="590" font-family="Nimbus Mono PS" font-size="15" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.5" opacity="1.0" style="">OBSERVATION</text><text x="86" y="660" font-family="Nimbus Sans" font-size="30" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">A public visual archive should keep authorship visible</text><text x="86" y="705" font-family="Nimbus Sans" font-size="30" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">without turning the archive into a portrait of its founder.</text><rect x="86" y="820" width="1068" height="330" rx="0" fill="#000000" stroke="none" stroke-width="0" opacity="1"/><text x="120" y="900" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#bdbdb7" letter-spacing="1.5" opacity="1.0" style="">LOCATION</text><text x="120" y="965" font-family="Nimbus Sans" font-size="45" font-weight="bold" text-anchor="start" fill="#ffffff" letter-spacing="-1.5" opacity="1.0" style="">FRIEDRICHSTRASSE</text><text x="120" y="1060" font-family="Nimbus Mono PS" font-size="23" font-weight="normal" text-anchor="start" fill="#ffffff" letter-spacing="0" opacity="1.0" style="">52.5200 N</text><text x="120" y="1100" font-family="Nimbus Mono PS" font-size="23" font-weight="normal" text-anchor="start" fill="#ffffff" letter-spacing="0" opacity="1.0" style="">13.4050 E</text><text x="86" y="1350" font-family="Nimbus Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Caption and supporting text remain regular. The display face appears</text><text x="86" y="1388" font-family="Nimbus Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">only where the hierarchy needs a decisive anchor.</text><text x="86" y="1655" font-family="Nimbus Sans" font-size="26" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-1.3" opacity="1.0" style="">berlin × kawe</text>
</svg>