<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<title>Type Scale</title>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="70" y="80" font-family="Nimbus Mono PS" font-size="20" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.5" opacity="1.0" style="">TYPE SCALE</text><text x="70" y="245" font-family="Nimbus Sans" font-size="135" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-7" opacity="1.0" style="">DISPLAY</text><text x="70" y="360" font-family="Nimbus Sans" font-size="76" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-3" opacity="1.0" style="">HEADING</text><text x="70" y="455" font-family="Nimbus Sans" font-size="48" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-1" opacity="1.0" style="">Subheading</text><text x="70" y="540" font-family="Nimbus Sans" font-size="28" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Body copy for sustained reading and captions.</text><text x="70" y="615" font-family="Nimbus Mono PS" font-size="19" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">METADATA / LOCATION / DATE</text><line x1="70" y1="670" x2="1130" y2="670" stroke="#b8b8b2" stroke-width="1" opacity="1"/><text x="70" y="730" font-family="Nimbus Mono PS" font-size="18" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="0" opacity="1.0" style="">220 / 96 / 48 / 24 / 16</text>
