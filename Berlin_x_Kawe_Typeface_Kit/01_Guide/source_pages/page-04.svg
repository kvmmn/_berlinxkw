<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>Berlin x Kawe Type Guide 4</title>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="72" y="62" font-family="Nimbus Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0.5" opacity="1.0" style="">BERLIN × KAWE</text><text x="800" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#70706b" letter-spacing="1.6" opacity="1.0" style="">MASTER LOCKUP</text><text x="1528" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="end" fill="#70706b" letter-spacing="0" opacity="1.0" style="">04</text><text x="72" y="170" font-family="Nimbus Sans" font-size="56" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-2" opacity="1.0" style="">Master lockup</text><text x="72" y="216" font-family="Nimbus Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="0" opacity="1.0" style="">Lowercase words, one shared typographic band, one true multiplication sign.</text><rect x="72" y="290" width="1456" height="430" rx="0" fill="#f5f5f2" stroke="none" stroke-width="0" opacity="1"/><line x1="120" y1="430" x2="1480" y2="430" stroke="#b8b8b2" stroke-width="2" opacity="1" stroke-dasharray="8 8"/><line x1="120" y1="630" x2="1480" y2="630" stroke="#b8b8b2" stroke-width="2" opacity="1" stroke-dasharray="8 8"/><text x="800" y="605" font-family="Nimbus Sans" font-size="196" font-weight="bold" text-anchor="middle" fill="#000000" letter-spacing="-10" opacity="1.0" style="paint-order:stroke;stroke:#000;stroke-width:2">berlin × kawe</text><text x="120" y="405" font-family="Nimbus Mono PS" font-size="13" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.5" opacity="1.0" style="">TOP ALIGNMENT</text><text x="120" y="670" font-family="Nimbus Mono PS" font-size="13" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.5" opacity="1.0" style="">BASE ALIGNMENT</text><text x="72" y="805" font-family="Nimbus Mono PS" font-size="16" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">01</text><text x="120" y="805" font-family="Nimbus Sans" font-size="19" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Keep the full lockup on one line.</text><text x="575" y="805" font-family="Nimbus Mono PS" font-size="16" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">02</text><text x="623" y="805" font-family="Nimbus Sans" font-size="19" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Scale × optically, not mathematically.</text><text x="1100" y="805" font-family="Nimbus Mono PS" font-size="16" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">03</text><text x="1148" y="805" font-family="Nimbus Sans" font-size="19" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Never replace × with x.</text>
</svg>