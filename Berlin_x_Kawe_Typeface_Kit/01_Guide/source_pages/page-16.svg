<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>Berlin x Kawe Type Guide 16</title>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="72" y="62" font-family="Nimbus Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0.5" opacity="1.0" style="">BERLIN × KAWE</text><text x="800" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#70706b" letter-spacing="1.6" opacity="1.0" style="">DO AND DO NOT</text><text x="1528" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="end" fill="#70706b" letter-spacing="0" opacity="1.0" style="">16</text><text x="72" y="145" font-family="Nimbus Sans" font-size="56" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-2" opacity="1.0" style="">Do and do not</text><text x="72" y="230" font-family="Nimbus Mono PS" font-size="18" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.8" opacity="1.0" style="">DO</text><text x="835" y="230" font-family="Nimbus Mono PS" font-size="18" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.8" opacity="1.0" style="">DO NOT</text><rect x="72" y="270" width="650" height="180" rx="0" fill="#f5f5f2" stroke="none" stroke-width="0" opacity="1"/><text x="105" y="390" font-family="Nimbus Sans" font-size="72" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-4" opacity="1.0" style="">berlin × kawe</text><rect x="835" y="270" width="650" height="180" rx="0" fill="#f5f5f2" stroke="none" stroke-width="0" opacity="1"/><text x="860" y="390" font-family="Nimbus Sans" font-size="68" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="8" opacity="1.0" style="">BERLIN X KAWE</text><line x1="835" y1="270" x2="1485" y2="450" stroke="#000000" stroke-width="8" opacity="1"/><line x1="1485" y1="270" x2="835" y2="450" stroke="#000000" stroke-width="8" opacity="1"/><text x="72" y="540" font-family="Nimbus Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Use lowercase for the master name.</text><text x="72" y="585" font-family="Nimbus Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Use the true multiplication sign.</text><text x="72" y="630" font-family="Nimbus Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Let one alignment decision lead the composition.</text><text x="72" y="675" font-family="Nimbus Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Crop only when recognition remains complete.</text><text x="835" y="540" font-family="Nimbus Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Do not add outlines, shadows or gradients.</text><text x="835" y="585" font-family="Nimbus Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Do not center every composition.</text><text x="835" y="630" font-family="Nimbus Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Do not combine more than three weights.</text><text x="835" y="675" font-family="Nimbus Sans" font-size="24" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Do not use × as a decorative pattern.</text><text x="72" y="820" font-family="Nimbus Mono PS" font-size="18" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="0" opacity="1.0" style="">Minimum contrast  4.5:1 for body text  /  3:1 for large display text</text>
</svg>