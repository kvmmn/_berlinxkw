<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>Berlin x Kawe Type Guide 15</title>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="72" y="62" font-family="Nimbus Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0.5" opacity="1.0" style="">BERLIN × KAWE</text><text x="800" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#70706b" letter-spacing="1.6" opacity="1.0" style="">PERSIAN COMPATIBILITY</text><text x="1528" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="end" fill="#70706b" letter-spacing="0" opacity="1.0" style="">15</text><text x="72" y="145" font-family="Nimbus Sans" font-size="56" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-2" opacity="1.0" style="">Persian compatibility</text><text x="72" y="192" font-family="Nimbus Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="0" opacity="1.0" style="">Persian follows the same mass, rhythm and frame logic without imitating Latin forms.</text><rect x="72" y="270" width="1456" height="255" rx="0" fill="#f5f5f2" stroke="none" stroke-width="0" opacity="1"/><text x="800" y="445" font-family="DejaVu Sans" font-size="125" font-weight="bold" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="direction:rtl;unicode-bidi:bidi-override">برلین × کاوه</text><text x="72" y="615" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.5" opacity="1.0" style="">DISPLAY</text><text x="72" y="660" font-family="Nimbus Sans" font-size="25" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Vazirmatn Black or Peyda ExtraBold</text><text x="72" y="718" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.5" opacity="1.0" style="">TEXT</text><text x="72" y="763" font-family="Nimbus Sans" font-size="25" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Vazirmatn Regular</text><text x="790" y="615" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.5" opacity="1.0" style="">RULES</text><text x="790" y="665" font-family="Nimbus Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Keep Persian and Latin on separate baselines when possible.</text><text x="790" y="705" font-family="Nimbus Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Match visual weight, not nominal point size.</text><text x="790" y="745" font-family="Nimbus Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Use × unchanged between the two scripts.</text><text x="790" y="785" font-family="Nimbus Sans" font-size="20" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Do not compress Persian tracking artificially.</text>
</svg>