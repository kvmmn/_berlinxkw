<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>Berlin x Kawe Type Guide 5</title>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="72" y="62" font-family="Nimbus Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0.5" opacity="1.0" style="">BERLIN × KAWE</text><text x="800" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#70706b" letter-spacing="1.6" opacity="1.0" style="">ALIGNMENT AND FRAME</text><text x="1528" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="end" fill="#70706b" letter-spacing="0" opacity="1.0" style="">05</text><text x="72" y="165" font-family="Nimbus Sans" font-size="56" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-2" opacity="1.0" style="">Alignment and frame</text><text x="72" y="210" font-family="Nimbus Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="0" opacity="1.0" style="">The frame is an active edge. Cropping is allowed only when recognition survives.</text><rect x="72" y="300" width="420" height="420" rx="0" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="1"/><text x="72" y="280" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.5" opacity="1.0" style="">QUIET</text><text x="104" y="520" font-family="Nimbus Sans" font-size="84" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-4" opacity="1.0" style="">berlin</text><text x="304" y="592" font-family="Nimbus Sans" font-size="52" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-2" opacity="1.0" style="">× kawe</text><rect x="565" y="300" width="420" height="420" rx="0" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="1"/><text x="565" y="280" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.5" opacity="1.0" style="">FRAME</text><text x="547" y="500" font-family="Nimbus Sans" font-size="112" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-6" opacity="1.0" style="">berlin</text><text x="715" y="625" font-family="Nimbus Sans" font-size="70" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-3" opacity="1.0" style="">× kawe</text><rect x="1058" y="300" width="420" height="420" rx="0" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="1"/><text x="1058" y="280" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.5" opacity="1.0" style="">PRESSURE</text><text x="1010" y="480" font-family="Nimbus Sans" font-size="132" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-7" opacity="1.0" style="">berlin</text><text x="1213" y="645" font-family="Nimbus Sans" font-size="82" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">×</text><text x="1266" y="708" font-family="Nimbus Sans" font-size="112" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-6" opacity="1.0" style="">kawe</text><text x="72" y="815" font-family="Nimbus Mono PS" font-size="15" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.5" opacity="1.0" style="">Margin rule</text><text x="72" y="850" font-family="Nimbus Sans" font-size="22" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Quiet layouts use 8% of the canvas. Pressure layouts may touch two edges, never all four.</text>
</svg>