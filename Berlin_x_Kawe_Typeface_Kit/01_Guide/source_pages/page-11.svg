<text x="72" y="62" font-family="Nimbus Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0.5" opacity="1.0" style="">BERLIN × KAWE</text><text x="800" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#70706b" letter-spacing="1.6" opacity="1.0" style="">CHARTS AND DIAGRAMS</text><text x="1528" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="end" fill="#70706b" letter-spacing="0" opacity="1.0" style="">11</text><text x="72" y="145" font-family="Nimbus Sans" font-size="56" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-2" opacity="1.0" style="">Charts and diagrams</text><text x="72" y="195" font-family="Nimbus Sans" font-size="21" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="0" opacity="1.0" style="">Typography carries the structure. Graphic marks stay quiet.</text><text x="72" y="275" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.5" opacity="1.0" style="">CONTRIBUTIONS BY DISTRICT</text><line x1="150" y1="700" x2="760" y2="700" stroke="#000000" stroke-width="2" opacity="1"/><line x1="150" y1="355" x2="150" y2="700" stroke="#000000" stroke-width="2" opacity="1"/><rect x="205" y="390" width="92" height="310" rx="0" fill="#000000" stroke="none" stroke-width="0" opacity="1"/><text x="251" y="735" font-family="Nimbus Mono PS" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">MITTE</text><text x="251" y="370" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">310</text><rect x="340" y="445" width="92" height="255" rx="0" fill="#000000" stroke="none" stroke-width="0" opacity="1"/><text x="386" y="735" font-family="Nimbus Mono PS" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">XBERG</text><text x="386" y="425" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">255</text><rect x="475" y="495" width="92" height="205" rx="0" fill="#000000" stroke="none" stroke-width="0" opacity="1"/><text x="521" y="735" font-family="Nimbus Mono PS" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">NK</text><text x="521" y="475" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">205</text><rect x="610" y="555" width="92" height="145" rx="0" fill="#000000" stroke="none" stroke-width="0" opacity="1"/><text x="656" y="735" font-family="Nimbus Mono PS" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">WEDDING</text><text x="656" y="535" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#000000" letter-spacing="0" opacity="1.0" style="">145</text><text x="890" y="275" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="1.5" opacity="1.0" style="">OBSERVATION DENSITY</text><line x1="930" y1="700" x2="1490" y2="700" stroke="#000000" stroke-width="2" opacity="1"/><line x1="930" y1="355" x2="930" y2="700" stroke="#000000" stroke-width="2" opacity="1"/><polyline points="950,650 1030,610 1110,630 1190,520 1270,545 1350,430 1430,390" fill="none" stroke="#000000" stroke-width="5"/><text x="950" y="735" font-family="Nimbus Mono PS" font-size="13" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">MON</text><text x="1430" y="735" font-family="Nimbus Mono PS" font-size="13" font-weight="normal" text-anchor="end" fill="#000000" letter-spacing="0" opacity="1.0" style="">SUN</text><text x="930" y="825" font-family="Nimbus Mono PS" font-size="15" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.5" opacity="1.0" style="">Rule</text><text x="1010" y="825" font-family="Nimbus Sans" font-size="18" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Labels use Mono. Titles use Text Bold.</text><text x="1010" y="858" font-family="Nimbus Sans" font-size="18" font-weight="normal" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Numbers never compete with the data.</text>
