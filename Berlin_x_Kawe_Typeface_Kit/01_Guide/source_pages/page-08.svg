<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>Berlin x Kawe Type Guide 8</title>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="72" y="62" font-family="Nimbus Sans" font-size="18" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0.5" opacity="1.0" style="">BERLIN × KAWE</text><text x="800" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="middle" fill="#70706b" letter-spacing="1.6" opacity="1.0" style="">CASE AND PUNCTUATION</text><text x="1528" y="62" font-family="Nimbus Mono PS" font-size="14" font-weight="normal" text-anchor="end" fill="#70706b" letter-spacing="0" opacity="1.0" style="">08</text><text x="72" y="165" font-family="Nimbus Sans" font-size="56" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-2" opacity="1.0" style="">Case and punctuation</text><text x="72" y="290" font-family="Nimbus Sans" font-size="132" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-7" opacity="1.0" style="">berlin × kawe</text><text x="72" y="340" font-family="Nimbus Mono PS" font-size="16" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.2" opacity="1.0" style="">BRAND LOCKUP  lowercase only</text><text x="72" y="495" font-family="Nimbus Sans" font-size="60" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="-1" opacity="1.0" style="">BERLIN / MITTE / 19:42</text><text x="72" y="545" font-family="Nimbus Mono PS" font-size="16" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.2" opacity="1.0" style="">METADATA  uppercase permitted</text><text x="72" y="675" font-family="Nimbus Sans" font-size="42" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">A city is a sequence of interruptions.</text><text x="72" y="720" font-family="Nimbus Mono PS" font-size="16" font-weight="normal" text-anchor="start" fill="#70706b" letter-spacing="1.2" opacity="1.0" style="">EDITORIAL  sentence case</text><rect x="1120" y="215" width="330" height="330" rx="0" fill="#000000" stroke="none" stroke-width="0" opacity="1"/><text x="1285" y="455" font-family="Nimbus Sans" font-size="245" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0" opacity="1.0" style="">×</text><text x="1120" y="600" font-family="Nimbus Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Use × for relation</text><text x="1120" y="635" font-family="Nimbus Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Use / for metadata</text><text x="1120" y="670" font-family="Nimbus Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Use : for time</text><text x="1120" y="705" font-family="Nimbus Sans" font-size="20" font-weight="bold" text-anchor="start" fill="#000000" letter-spacing="0" opacity="1.0" style="">Avoid decorative punctuation</text>
