<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Four tablo gallery fixture (local only)</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        background: #f3f3ef;
        max-width: 1140px;
      }
      .bk-tablo-justified-gallery {
        --bk-tablo-gap: 2.75rem;
        --bk-tablo-row-target-h: 360px;
        display: flex;
        flex-direction: column;
        gap: var(--bk-tablo-gap);
      }
      .bk-tablo-justified-row {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: var(--bk-tablo-gap);
        width: 100%;
      }
      .bk-tablo-justified-row--full .bk-tablo-justified-cell {
        flex: var(--tile-aspect-grow) 1 0;
        min-width: 0;
      }
      .bk-tablo-justified-row--tail {
        justify-content: flex-start;
      }
      .bk-tablo-justified-row--tail .bk-tablo-justified-cell {
        flex: 0 0 auto;
        width: calc(var(--tile-aspect-grow) * var(--bk-tablo-row-target-h));
      }
      .bk-aspect-frame {
        width: 100%;
        aspect-ratio: var(--tile-aspect-ratio);
        background: #e8e8e4;
      }
      .bk-aspect-frame img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="bk-tablo-justified-gallery">
      <ul class="bk-tablo-justified-row bk-tablo-justified-row--full" role="list">
        <li class="bk-tablo-justified-cell" style="--tile-aspect-grow: 1.333; --tile-aspect-ratio: 4 / 3"><div class="bk-aspect-frame"><img src="data:image/svg+xml,%3Csvg width='400' height='300'/%3E" alt="" /></div></li>
        <li class="bk-tablo-justified-cell" style="--tile-aspect-grow: 1.333; --tile-aspect-ratio: 4 / 3"><div class="bk-aspect-frame"><img src="data:image/svg+xml,%3Csvg width='400' height='300'/%3E" alt="" /></div></li>
        <li class="bk-tablo-justified-cell" style="--tile-aspect-grow: 1.333; --tile-aspect-ratio: 4 / 3"><div class="bk-aspect-frame"><img src="data:image/svg+xml,%3Csvg width='400' height='300'/%3E" alt="" /></div></li>
      </ul>
      <ul class="bk-tablo-justified-row bk-tablo-justified-row--tail" role="list">
        <li class="bk-tablo-justified-cell" style="--tile-aspect-grow: 1.333; --tile-aspect-ratio: 4 / 3"><div class="bk-aspect-frame"><img src="data:image/svg+xml,%3Csvg width='400' height='300'/%3E" alt="" /></div></li>
      </ul>
    </div>
  </body>
</html>
